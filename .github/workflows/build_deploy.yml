name: Prod Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Test Connection
        run: |
          curl photo.chris-besch.com
          curl $IMMICH_BASE_URL
        env:
          IMMICH_BASE_URL: "${{vars.IMMICH_BASE_URL}}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.1

      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y exiftool

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Dependencies
        run: npm install

      - name: Clean
        run: npm run clean

      - name: Build
        run: npm run build
        env:
          IMMICH_BASE_URL: "${{vars.IMMICH_BASE_URL}}"
          IMMICH_API_KEY: "${{secrets.IMMICH_API_KEY}}"

      - name: Check Image Size
        run: npm run check_image_size

      - name: Generate the Sitemap
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://www.chris-besch.com/
          path-to-root: deploy

      - name: Output stats
        run: |
          echo "sitemap-path = ${{ steps.sitemap.outputs.sitemap-path }}"
          echo "url-count = ${{ steps.sitemap.outputs.url-count }}"
          echo "excluded-count = ${{ steps.sitemap.outputs.excluded-count }}"

      - name: Remove untrue lastmod
        run: sed -i 's#<lastmod>.\+</lastmod>##g' deploy/sitemap.xml

      - name: Commit new Sitemap
        uses: EndBug/add-and-commit@v10
        with:
          add: 'deploy/sitemap.xml'
          author_name: Christopher Besch
          author_email: mail@chris-besch.com
          message: 'feat: Update sitemap.xml'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.4
        with:
          branch: deploy
          folder: deploy
